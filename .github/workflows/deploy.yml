name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          # This assumes you copy the Containerfile from the official repo into your root or use their path
          file: https://raw.githubusercontent.com/frappe/frappe_docker/main/images/layered/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/isp_ops_staging:latest
          build-args: |
            APPS_JSON_BASE64=${{ secrets.APPS_JSON_BASE64 }}
